<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>%sveltekit.status% · Mikkel Elvers</title>
    <style>
      body {
        color-scheme: light dark;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Open Runde", system-ui, sans-serif;
        color: light-dark(#000, #fff);
        background: light-dark(#fff, #000);
      }

      main {
        max-width: 42rem;
        width: 100%;
      }

      p.code {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 500;
        color: light-dark(rgb(0 0 0 / 0.6), rgb(255 255 255 / 0.6));
      }

      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      p.msg {
        margin: 1rem 0 0;
        font-size: 1.25rem;
        line-height: 1.375;
        color: light-dark(rgb(0 0 0 / 0.6), rgb(255 255 255 / 0.6));
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.625rem 1.5rem;
        border-radius: 9999px;
        background: light-dark(#000, #fff);
        color: light-dark(#fff, #000);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <main role="alert">
      <p class="code">%sveltekit.status%</p>
      <h1>Something went wrong</h1>
      <p class="msg">%sveltekit.error.message%</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
